name: Formal Xcode 27.2 baseline

# Goal A: compile-only evidence on GitHub's public xcode-27 arm64 runners.
# No IPA packaging, ad-hoc codesign, cache restore/save of Madeira.ipa, or release artifacts.

on:
  pull_request:
  push:
    branches:
      - cursor/formal-xcode272-baseline-5633

permissions:
  contents: read

concurrency:
  group: formal272-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-compile:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "github_ref=${GITHUB_REF}"
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            uname -a
            uname -m
            if [[ -f /etc/environment ]]; then
              grep -E '^(ImageVersion|ImageOS)=' /etc/environment || true
            fi
            echo "ImageVersion=${ImageVersion:-}"
            echo "ImageOS=${ImageOS:-}"
          } | tee runner-identity.log

      - name: Select and assert formal Xcode 27.2 (27B52)
        shell: bash
        run: |
          set -euo pipefail
          FORMAL_XCODE="/Applications/Xcode_27.2.app"
          [[ -d "$FORMAL_XCODE" ]] || { echo "ERROR: missing $FORMAL_XCODE on runner" >&2; exit 1; }
          export DEVELOPER_DIR="$FORMAL_XCODE/Contents/Developer"
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" | tee xcode-select.log
          xcode-select -p | tee -a xcode-select.log
          {
            xcodebuild -version
            echo "---"
            xcodebuild -showsdks
            echo "--- iphoneos SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "--- iphoneos SDK build: $(xcrun --sdk iphoneos --show-sdk-build-version)"
            echo "--- iphoneos SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
          } | tee xcode-sdk-evidence.log
          xcodebuild -version | awk 'NR==1{ver=$2} NR==2{build=$0} END{
            if (ver != "27.2") { printf "ERROR: expected Xcode 27.2, got %s\n", ver > "/dev/stderr"; exit 1 }
            if (build !~ /27B52/) { printf "ERROR: expected build 27B52, got %s\n", build > "/dev/stderr"; exit 1 }
          }'
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$ios_sdk" == 27.2* ]] || { echo "ERROR: expected iPhoneOS SDK 27.2.x, got $ios_sdk" >&2; exit 1; }

      - name: CI input fingerprint (ci-input-key.sh)
        id: sdk
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/ci-input-key.sh
          cat "$GITHUB_OUTPUT" | tee ci-input-key.log

      - name: Compile Madeira.app (no IPA packaging or codesign)
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          DERIVED="$ROOT/app/DerivedData"
          CONFIGURATION=Debug
          CMD=(
            xcodebuild
            -project "$ROOT/app/Madeira.xcodeproj"
            -scheme Madeira
            -configuration "$CONFIGURATION"
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -derivedDataPath "$DERIVED"
            IPHONEOS_DEPLOYMENT_TARGET=18.0
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            build
          )
          printf 'compile_command=%q\n' "${CMD[@]}" | tee xcodebuild-command.log
          "${CMD[@]}" 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "xcodebuild_exit_status=$status" | tee -a xcodebuild-command.log
          exit "$status"

      - name: Upload text build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal272-baseline-logs
          path: |
            runner-identity.log
            xcode-select.log
            xcode-sdk-evidence.log
            ci-input-key.log
            xcodebuild-command.log
            xcodebuild.log
          if-no-files-found: warn
